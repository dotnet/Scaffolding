parameters:
- name: fullValidation
  displayName: Run the exhaustive OS/configuration matrix
  type: boolean
  default: false

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*

pr:
  branches:
    include:
    - '*'

schedules:
- cron: '0 6 * * *'
  displayName: Daily exhaustive validation
  branches:
    include:
    - main
  always: true

variables:
- name: _TeamName
  value: DotNetCore
- name: _PublishUsingPipelines
  value: true
- name: _DotNetArtifactsCategory
  value: .NETCore
- template: /eng/common/templates/variables/pool-providers.yml

stages:
- ${{ if or(parameters.fullValidation, eq(variables['Build.Reason'], 'Schedule')) }}:
  - template: /eng/pipelines/full-validation.yml
- ${{ else }}:
  - stage: pr
    displayName: PR validation
    jobs:
    - template: /eng/pipelines/pr-validation.yml
