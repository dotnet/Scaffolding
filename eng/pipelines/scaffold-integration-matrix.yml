# Template: Scaffold Integration Matrix
# Runs integration tests sharded by scaffolder Family, with all Framework TFMs per job.
# Usage: Reference from azure-pipelines-pr.yml and azure-pipelines.yml

parameters:
- name: buildConfig
  type: string
  default: Release
- name: poolName
  type: string
  default: ''
- name: poolImage
  type: string
  default: ''
- name: poolDemands
  type: string
  default: ''
- name: poolVmImage
  type: string
  default: ''
- name: reuseBuildOutputs
  type: boolean
  default: false
- name: producerJob
  type: string
  default: ''

jobs:
# CLI Option Coverage gate — fast, non-matrix
- ${{ if eq(parameters.producerJob, '') }}:
  - job: CLIOptionCoverage
    displayName: CLI Option Coverage Gate
    timeoutInMinutes: 30
    pool:
      ${{ if ne(parameters.poolName, '') }}:
        name: ${{ parameters.poolName }}
        ${{ if ne(parameters.poolImage, '') }}:
          image: ${{ parameters.poolImage }}
        ${{ if ne(parameters.poolDemands, '') }}:
          demands: ${{ parameters.poolDemands }}
      ${{ if ne(parameters.poolVmImage, '') }}:
        vmImage: ${{ parameters.poolVmImage }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: 8.x
        installationPath: $(Build.SourcesDirectory)/.dotnet
    - task: UseDotNet@2
      displayName: Install .NET 9 SDK
      inputs:
        packageType: sdk
        version: 9.x
        installationPath: $(Build.SourcesDirectory)/.dotnet
    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.x
        installationPath: $(Build.SourcesDirectory)/.dotnet
    - script: eng\common\build.cmd
        -configuration ${{ parameters.buildConfig }}
        -prepareMachine
        -restore -build -ci
      displayName: Build
    - script: >
        dotnet test test/dotnet-scaffolding/dotnet-scaffold.Tests/dotnet-scaffold.Tests.csproj
        --no-build
        -c ${{ parameters.buildConfig }}
        --filter "FullyQualifiedName~CI."
        --logger "trx;LogFileName=CLIOptionCoverage.trx"
        --results-directory $(Build.ArtifactStagingDirectory)/TestResults
      displayName: Run CLI Option Coverage Tests
    - ${{ if parameters.reuseBuildOutputs }}:
      - task: PublishPipelineArtifact@1
        displayName: Publish Integration Binaries
        inputs:
          targetPath: $(Build.SourcesDirectory)\artifacts\bin
          artifact: ScaffoldIntegrationBinaries
    - task: PublishTestResults@2
      displayName: Publish CLI Option Coverage Results
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/TestResults/*.trx'
        testRunTitle: CLI Option Coverage
    - task: PublishBuildArtifacts@1
      displayName: Publish CLI Option Coverage Test Result Files
      condition: always()
      inputs:
        pathToPublish: $(Build.ArtifactStagingDirectory)/TestResults
        artifactName: TestResults-CLIOptionCoverage
        artifactType: Container

# Integration test matrix — one job per scaffolder family
- job: ScaffoldIntegration
  displayName: 'Integration: '
  dependsOn: ${{ coalesce(parameters.producerJob, 'CLIOptionCoverage') }}
  timeoutInMinutes: 60
  pool:
    ${{ if ne(parameters.poolName, '') }}:
      name: ${{ parameters.poolName }}
      ${{ if ne(parameters.poolImage, '') }}:
        image: ${{ parameters.poolImage }}
      ${{ if ne(parameters.poolDemands, '') }}:
        demands: ${{ parameters.poolDemands }}
    ${{ if ne(parameters.poolVmImage, '') }}:
      vmImage: ${{ parameters.poolVmImage }}
  strategy:
    matrix:
      API:
        _Family: 'Family=apicontroller|Family=minimalapi'
        _FamilyLabel: API
      Blazor:
        _Family: 'Family=blazor-crud|Family=blazor-empty'
        _FamilyLabel: Blazor
      MVC:
        _Family: 'Family=mvccontroller|Family=mvccontroller-crud|Family=razorviews|Family=razorview-empty|Family=area'
        _FamilyLabel: MVC
      RazorPages:
        _Family: 'Family=razorpages-crud|Family=razorpage-empty'
        _FamilyLabel: RazorPages
      Identity:
        _Family: 'Family=identity|Family=blazor-identity'
        _FamilyLabel: Identity
      EntraId:
        _Family: 'Family=entra-id'
        _FamilyLabel: EntraId
      Aspire:
        _Family: 'Family=aspire-caching|Family=aspire-database|Family=aspire-storage'
        _FamilyLabel: Aspire
  steps:
  - checkout: self
    clean: true
  - task: UseDotNet@2
    displayName: Install .NET 8 SDK
    inputs:
      packageType: sdk
      version: 8.x
      installationPath: $(Build.SourcesDirectory)/.dotnet
  - task: UseDotNet@2
    displayName: Install .NET 9 SDK
    inputs:
      packageType: sdk
      version: 9.x
      installationPath: $(Build.SourcesDirectory)/.dotnet
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.x
      installationPath: $(Build.SourcesDirectory)/.dotnet
  - ${{ if parameters.reuseBuildOutputs }}:
    # Restore on each agent so generated assets reference its own package cache.
    - script: eng\common\build.cmd
        -configuration ${{ parameters.buildConfig }}
        -prepareMachine
        -restore -ci
      displayName: Restore Integration Dependencies
    - task: DownloadPipelineArtifact@2
      displayName: Download Integration Binaries
      inputs:
        buildType: current
        artifactName: ScaffoldIntegrationBinaries
        targetPath: $(Build.SourcesDirectory)\artifacts\bin
  - ${{ else }}:
    - script: eng\common\build.cmd
        -configuration ${{ parameters.buildConfig }}
        -prepareMachine
        -restore -build -ci
      displayName: Build
  - script: >
      dotnet test test/dotnet-scaffolding/dotnet-scaffold.Tests/dotnet-scaffold.Tests.csproj
      --no-build
      -c ${{ parameters.buildConfig }}
      --filter "Suite=ScaffoldIntegration&($(_Family))"
      --logger "trx;LogFileName=Integration-$(_FamilyLabel).trx"
      --results-directory $(Build.ArtifactStagingDirectory)/TestResults
    displayName: 'Run $(_FamilyLabel) Integration Tests'
  - task: PublishTestResults@2
    displayName: Publish Integration Test Results
    condition: always()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Build.ArtifactStagingDirectory)/TestResults/*.trx'
      testRunTitle: 'Integration - $(_FamilyLabel)'
  - task: PublishBuildArtifacts@1
    displayName: 'Publish $(_FamilyLabel) Test Result Files'
    condition: always()
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)/TestResults
      artifactName: 'TestResults-Integration-$(_FamilyLabel)'
      artifactType: Container
